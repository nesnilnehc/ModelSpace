<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#0d1520" />
  <rect x="28" y="28" width="744" height="744" rx="24" fill="#121c2a" stroke="rgba(180,210,230,0.55)" />
  <text x="400" y="78" text-anchor="middle" fill="rgba(190,210,230,0.75)" font-size="26" font-family="Inter,Arial,sans-serif">FMEA</text>

  <!-- Failure Mode: input context -->
  <rect x="240" y="130" width="320" height="56" rx="12" fill="#6b7b8c" fill-opacity="0.25" stroke="#6b7b8c" stroke-opacity="0.8" />
  <text x="400" y="167" text-anchor="middle" fill="#dbe8f4" font-size="18" font-family="Inter,Arial,sans-serif">Failure Mode（失效模式）</text>
  <line x1="400" y1="186" x2="400" y2="220" stroke="rgba(180,210,230,0.4)" stroke-width="2" />

  <!-- S × O × D = RPN formula flow (centered) -->
  <!-- Severity (S) -->
  <rect x="58" y="240" width="140" height="100" rx="12" fill="#00f0ff" fill-opacity="0.18" stroke="#00f0ff" />
  <text x="128" y="285" text-anchor="middle" fill="#dbe8f4" font-size="20" font-family="Inter,Arial,sans-serif">Severity</text>
  <text x="128" y="312" text-anchor="middle" fill="rgba(219,232,244,0.8)" font-size="16">S (严重度)</text>

  <!-- × -->
  <text x="233" y="305" text-anchor="middle" fill="rgba(180,210,230,0.6)" font-size="36" font-family="Inter,Arial,sans-serif">×</text>

  <!-- Occurrence (O) -->
  <rect x="268" y="240" width="140" height="100" rx="12" fill="#ff8c42" fill-opacity="0.18" stroke="#ff8c42" />
  <text x="338" y="285" text-anchor="middle" fill="#dbe8f4" font-size="20" font-family="Inter,Arial,sans-serif">Occurrence</text>
  <text x="338" y="312" text-anchor="middle" fill="rgba(219,232,244,0.8)" font-size="16">O (发生度)</text>

  <!-- × -->
  <text x="443" y="305" text-anchor="middle" fill="rgba(180,210,230,0.6)" font-size="36" font-family="Inter,Arial,sans-serif">×</text>

  <!-- Detection (D) -->
  <rect x="478" y="240" width="140" height="100" rx="12" fill="#9d7bff" fill-opacity="0.18" stroke="#9d7bff" />
  <text x="548" y="285" text-anchor="middle" fill="#dbe8f4" font-size="20" font-family="Inter,Arial,sans-serif">Detection</text>
  <text x="548" y="312" text-anchor="middle" fill="rgba(219,232,244,0.8)" font-size="16">D (探测度)</text>

  <!-- = -->
  <text x="653" y="305" text-anchor="middle" fill="rgba(180,210,230,0.6)" font-size="36" font-family="Inter,Arial,sans-serif">=</text>

  <!-- RPN output -->
  <rect x="678" y="240" width="64" height="100" rx="12" fill="#00f0ff" fill-opacity="0.28" stroke="#00f0ff" stroke-width="2" />
  <text x="710" y="292" text-anchor="middle" fill="#dbe8f4" font-size="22" font-family="Inter,Arial,sans-serif" font-weight="bold">RPN</text>
  <text x="710" y="320" text-anchor="middle" fill="rgba(219,232,244,0.8)" font-size="14">1–1000</text>

  <!-- Scale hint: 1–10 each -->
  <text x="400" y="400" text-anchor="middle" fill="rgba(180,210,230,0.5)" font-size="16" font-family="Inter,Arial,sans-serif">S, O, D 各 1–10 分制</text>

  <!-- Preventive Action: output -->
  <line x1="400" y1="430" x2="400" y2="470" stroke="rgba(180,210,230,0.4)" stroke-width="2" />
  <polygon points="395,460 405,460 400,470" fill="rgba(180,210,230,0.4)" />
  <rect x="180" y="500" width="440" height="70" rx="12" fill="#121c2a" stroke="rgba(0,240,255,0.4)" stroke-dasharray="6,4" />
  <text x="400" y="532" text-anchor="middle" fill="rgba(219,232,244,0.9)" font-size="18" font-family="Inter,Arial,sans-serif">针对高 RPN 制定防范措施</text>
  <text x="400" y="558" text-anchor="middle" fill="rgba(180,210,230,0.5)" font-size="14">防呆 · 冗余 · 检测预警</text>
</svg>
